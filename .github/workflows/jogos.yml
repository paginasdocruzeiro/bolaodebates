name: Fetch Matches Cruzeiro

on:
  workflow_dispatch:
  schedule:
    # Atualiza resultados e próximos jogos a cada 4 horas.
    - cron: "0 */4 * * *"

permissions:
  contents: read

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Fetch matches and sync Firebase
        env:
          RAPIDAPI_KEY: ${{ secrets.RAPIDAPI_KEY }}
          FIREBASE_DB_URL: ${{ secrets.FIREBASE_DB_URL }}
          FIREBASE_SECRET: ${{ secrets.FIREBASE_SECRET }}
        run: |
          set -euo pipefail

          TEAM_ID=1954
          BASE_PATH="bolao-cruzeiro-debates"

          for var_name in RAPIDAPI_KEY FIREBASE_DB_URL FIREBASE_SECRET; do
            if [ -z "${!var_name:-}" ]; then
              echo "Secret ausente: ${var_name}"
              exit 1
            fi
          done

          FIREBASE_DB_URL="${FIREBASE_DB_URL%/}"

          curl --fail-with-body --silent --show-error --retry 3 --retry-delay 3 \
            --request GET \
            "https://sofascore.p.rapidapi.com/teams/get-last-matches?teamId=${TEAM_ID}&pageIndex=0" \
            --header "x-rapidapi-host: sofascore.p.rapidapi.com" \
            --header "x-rapidapi-key: ${RAPIDAPI_KEY}" \
            --output /tmp/last.json

          curl --fail-with-body --silent --show-error --retry 3 --retry-delay 3 \
            --request GET \
            "https://sofascore.p.rapidapi.com/teams/get-next-matches?teamId=${TEAM_ID}&pageIndex=0" \
            --header "x-rapidapi-host: sofascore.p.rapidapi.com" \
            --header "x-rapidapi-key: ${RAPIDAPI_KEY}" \
            --output /tmp/next.json

          curl --fail-with-body --silent --show-error --retry 3 --retry-delay 3 \
            "${FIREBASE_DB_URL}/${BASE_PATH}/state.json?auth=${FIREBASE_SECRET}" \
            --output /tmp/state.json

          node <<'NODE'
          const fs = require('fs');

          const TEAM_ID = '1954';
          const APP_TIME_ZONE = 'America/Sao_Paulo';
          const nowIso = new Date().toISOString();

          const DEFAULT_AUTOMATION = {
            enabled: true,
            openBetsEnabled: true,
            openBeforeValue: 12,
            openBeforeUnit: 'hours',
            closeBetsEnabled: true,
            closeBeforeValue: 5,
            closeBeforeUnit: 'minutes',
            autoApplyResults: true,
            autoCreateRounds: true,
            newRoundDefaultMode: 'auto',
            allowManualOverride: true
          };

          function readJson(file, fallback) {
            try {
              const text = fs.readFileSync(file, 'utf8');
              if (!text || text === 'null') return fallback;
              return JSON.parse(text);
            } catch (error) {
              console.error(`Falha ao ler ${file}:`, error.message);
              return fallback;
            }
          }

          function zonedParts(date, timeZone = APP_TIME_ZONE) {
            const parts = new Intl.DateTimeFormat('en-CA', {
              timeZone,
              year: 'numeric',
              month: '2-digit',
              day: '2-digit',
              hour: '2-digit',
              minute: '2-digit',
              second: '2-digit',
              hourCycle: 'h23'
            }).formatToParts(date);

            return Object.fromEntries(
              parts.filter(part => part.type !== 'literal').map(part => [part.type, part.value])
            );
          }

          function zoneOffsetMs(date, timeZone = APP_TIME_ZONE) {
            const parts = zonedParts(date, timeZone);
            const asUtc = Date.UTC(
              Number(parts.year),
              Number(parts.month) - 1,
              Number(parts.day),
              Number(parts.hour),
              Number(parts.minute),
              Number(parts.second || 0)
            );
            return asUtc - date.getTime();
          }

          function toAppLocalInput(ms) {
            if (!Number.isFinite(ms) || ms <= 0) return '';
            const parts = zonedParts(new Date(ms));
            return `${parts.year}-${parts.month}-${parts.day}T${parts.hour}:${parts.minute}`;
          }

          function parseMs(value) {
            if (!value) return NaN;

            if (/Z$|[+-]\d{2}:?\d{2}$/.test(String(value))) {
              const result = Date.parse(value);
              return Number.isFinite(result) ? result : NaN;
            }

            const [datePart, timePart = '00:00'] = String(value).split('T');
            const [year, month, day] = datePart.split('-').map(Number);
            const [hour, minute] = timePart.split(':').map(Number);

            if (![year, month, day, hour, minute].every(Number.isFinite)) return NaN;

            const guess = new Date(Date.UTC(year, month - 1, day, hour, minute, 0));
            return guess.getTime() - zoneOffsetMs(guess);
          }

          function durationMs(value, unit) {
            const number = Number(value);
            if (!Number.isFinite(number)) return 0;
            if (unit === 'days') return number * 86400000;
            if (unit === 'hours') return number * 3600000;
            return number * 60000;
          }

          function normalizeName(value) {
            return String(value || '')
              .normalize('NFD')
              .replace(/[\u0300-\u036f]/g, '')
              .toLowerCase()
              .replace(/\b(ec|fc|sc|saf|clube|club|esporte|futebol)\b/g, '')
              .replace(/[^a-z0-9]+/g, ' ')
              .trim();
          }

          const lastPayload = readJson('/tmp/last.json', { events: [] });
          const nextPayload = readJson('/tmp/next.json', { events: [] });
          const state = readJson('/tmp/state.json', {}) || {};

          if (!Array.isArray(lastPayload.events)) {
            throw new Error('A resposta de últimos jogos não contém events.');
          }
          if (!Array.isArray(nextPayload.events)) {
            throw new Error('A resposta de próximos jogos não contém events.');
          }
          if (!Array.isArray(state.rounds)) state.rounds = [];

          const automation = {
            ...DEFAULT_AUTOMATION,
            ...(state.settings?.automation || state.automation || {})
          };

          function adapt(event) {
            const homeId = event.homeTeam?.id != null ? String(event.homeTeam.id) : '';
            const awayId = event.awayTeam?.id != null ? String(event.awayTeam.id) : '';
            const startMs = Number(event.startTimestamp || 0) * 1000;

            return {
              idEvent: String(event.id || ''),
              idHomeTeam: homeId,
              idAwayTeam: awayId,
              strHomeTeam: event.homeTeam?.shortName || event.homeTeam?.name || '',
              strAwayTeam: event.awayTeam?.shortName || event.awayTeam?.name || '',
              strLeague: event.tournament?.name || event.season?.tournament?.name || '',
              dateEvent: startMs ? toAppLocalInput(startMs).slice(0, 10) : '',
              strTime: startMs ? toAppLocalInput(startMs).slice(11) : '',
              matchTime: startMs ? toAppLocalInput(startMs) : '',
              startTimestamp: Number(event.startTimestamp || 0),
              intHomeScore: event.homeScore?.current ?? event.homeScore?.normaltime ?? null,
              intAwayScore: event.awayScore?.current ?? event.awayScore?.normaltime ?? null,
              statusType: event.status?.type || '',
              statusDescription: event.status?.description || '',
              winnerCode: event.winnerCode ?? null
            };
          }

          function isCruzeiroHome(match) {
            return String(match.idHomeTeam) === TEAM_ID;
          }

          function opponentName(match) {
            return isCruzeiroHome(match) ? match.strAwayTeam : match.strHomeTeam;
          }

          function isFinished(match) {
            const type = String(match.statusType || '').toLowerCase();
            const description = String(match.statusDescription || '').toLowerCase();
            return ['finished', 'afterextra', 'afterpenalties', 'ended'].includes(type) ||
              ['finished', 'ended', 'ap', 'aet'].includes(description);
          }

          function scoreForCruzeiro(match) {
            const home = Number(match.intHomeScore);
            const away = Number(match.intAwayScore);
            if (!Number.isFinite(home) || !Number.isFinite(away)) return null;
            return isCruzeiroHome(match)
              ? { cruzeiro: home, opponent: away }
              : { cruzeiro: away, opponent: home };
          }

          function safeId() {
            return global.crypto?.randomUUID?.() ||
              `round-${Date.now()}-${Math.random().toString(16).slice(2)}`;
          }

          function getRoundNumber(round) {
            const explicit = Number(round?.roundNumber);
            if (Number.isFinite(explicit)) return explicit;
            const match = String(round?.title || '').match(/rodada\s*(\d+)/i);
            return match ? Number(match[1]) : 0;
          }

          function nextRoundNumber(rounds) {
            return rounds.reduce((max, round) => Math.max(max, getRoundNumber(round)), 0) + 1;
          }

          function findExistingRound(rounds, match) {
            const externalId = String(match.idEvent || '');
            if (externalId) {
              const exact = rounds.find(round =>
                String(round.externalId || round.idEvent || '') === externalId
              );
              if (exact) return exact;
            }

            const matchMs = parseMs(match.matchTime);
            const opponent = normalizeName(opponentName(match));

            return rounds.find(round => {
              const roundMs = parseMs(round.matchTime);
              if (!Number.isFinite(matchMs) || !Number.isFinite(roundMs)) return false;
              const sameOpponent = normalizeName(round.opponent) === opponent;
              const sameWindow = Math.abs(matchMs - roundMs) <= 36 * 3600000;
              return sameOpponent && sameWindow;
            }) || null;
          }

          function calculateTimes(matchTime) {
            const matchMs = parseMs(matchTime);
            return {
              autoOpenAt: toAppLocalInput(
                matchMs - durationMs(automation.openBeforeValue, automation.openBeforeUnit)
              ),
              deadline: toAppLocalInput(
                matchMs - durationMs(automation.closeBeforeValue, automation.closeBeforeUnit)
              )
            };
          }

          function upsertUpcomingRound(match) {
            if (!automation.enabled || !automation.autoCreateRounds) return false;
            if (!match.idEvent || !match.matchTime) return false;

            const matchMs = parseMs(match.matchTime);
            if (!Number.isFinite(matchMs) || matchMs < Date.now() - 6 * 3600000) return false;

            let round = findExistingRound(state.rounds, match);
            const times = calculateTimes(match.matchTime);

            if (!round) {
              const number = nextRoundNumber(state.rounds);
              round = {
                id: safeId(),
                roundNumber: number,
                title: `Rodada ${number}`,
                opponent: opponentName(match),
                competition: match.strLeague || 'Jogo do Cruzeiro',
                matchTime: match.matchTime,
                autoOpenAt: times.autoOpenAt,
                deadline: times.deadline,
                resultCruzeiro: null,
                resultOpponent: null,
                manualState: automation.newRoundDefaultMode || 'auto',
                externalId: String(match.idEvent),
                source: 'sofascore',
                cruzeiroIsHome: isCruzeiroHome(match),
                homeTeam: match.strHomeTeam,
                awayTeam: match.strAwayTeam,
                createdAt: nowIso,
                updatedAt: nowIso
              };
              state.rounds.push(round);
              console.log(`Nova rodada criada: ${round.title} — Cruzeiro x ${round.opponent}`);
              return true;
            }

            round.externalId = String(match.idEvent);
            round.source = round.source || 'sofascore';
            round.opponent = round.opponent || opponentName(match);
            round.competition = round.competition || match.strLeague || 'Jogo do Cruzeiro';
            round.matchTime = match.matchTime;
            round.autoOpenAt = times.autoOpenAt;
            round.deadline = times.deadline;
            round.cruzeiroIsHome = isCruzeiroHome(match);
            round.homeTeam = match.strHomeTeam;
            round.awayTeam = match.strAwayTeam;
            round.updatedAt = nowIso;

            if (!Number.isFinite(Number(round.roundNumber))) {
              round.roundNumber = getRoundNumber(round) ||
                nextRoundNumber(state.rounds.filter(item => item !== round));
            }
            if (!round.title || !/rodada\s*\d+/i.test(round.title)) {
              round.title = `Rodada ${round.roundNumber}`;
            }

            return true;
          }

          function applyFinishedResult(match) {
            if (!automation.enabled || !automation.autoApplyResults || !isFinished(match)) return false;

            const score = scoreForCruzeiro(match);
            if (!score) return false;

            const round = findExistingRound(state.rounds, match);
            if (!round) {
              console.log(`Resultado sem rodada correspondente: Cruzeiro x ${opponentName(match)}`);
              return false;
            }

            const alreadyHasResult =
              round.resultCruzeiro !== null && round.resultCruzeiro !== undefined &&
              round.resultOpponent !== null && round.resultOpponent !== undefined;

            // Nunca sobrescreve um resultado manual divergente.
            if (alreadyHasResult && round.resultSource === 'manual') {
              const sameScore = Number(round.resultCruzeiro) === score.cruzeiro &&
                Number(round.resultOpponent) === score.opponent;
              if (!sameScore) {
                console.log(`Resultado manual preservado: ${round.title || round.id}`);
                return false;
              }
            }

            // Resultado legado sem fonte: só finaliza automaticamente se coincidir com a API.
            if (alreadyHasResult && !round.resultSource) {
              const sameScore = Number(round.resultCruzeiro) === score.cruzeiro &&
                Number(round.resultOpponent) === score.opponent;
              if (!sameScore) {
                console.log(`Resultado legado divergente preservado: ${round.title || round.id}`);
                return false;
              }
            }

            round.resultCruzeiro = score.cruzeiro;
            round.resultOpponent = score.opponent;
            round.resultSource = round.resultSource === 'manual' ? 'manual' : 'api';
            round.resultUpdatedAt = nowIso;
            round.externalId = String(match.idEvent);
            round.manualState = 'finalized';
            round.finalizedAt = round.finalizedAt || nowIso;
            round.updatedAt = nowIso;

            console.log(
              `Resultado aplicado e rodada finalizada: ${round.title || round.id} — ` +
              `Cruzeiro ${score.cruzeiro} x ${score.opponent} ${round.opponent}`
            );
            return true;
          }

          const finished = lastPayload.events
            .slice()
            .sort((a, b) => Number(b.startTimestamp || 0) - Number(a.startTimestamp || 0))
            .slice(0, 12)
            .map(adapt);

          const upcoming = nextPayload.events
            .slice()
            .sort((a, b) => Number(a.startTimestamp || 0) - Number(b.startTimestamp || 0))
            .slice(0, 12)
            .map(adapt);

          finished.forEach(applyFinishedResult);
          upcoming.slice(0, 5).forEach(upsertUpcomingRound);

          state.rounds.sort((a, b) => parseMs(a.matchTime) - parseMs(b.matchTime));

          const externalMatches = {
            finished: finished.slice(0, 5),
            upcoming: upcoming.slice(0, 5),
            updatedAt: nowIso
          };

          if (!state.settings || typeof state.settings !== 'object') state.settings = {};
          state.settings.automation = {
            ...automation,
            updatedAt: automation.updatedAt || nowIso
          };

          const statePatch = {
            externalMatches,
            rounds: state.rounds,
            settings: state.settings
          };

          fs.writeFileSync('/tmp/state-patch.json', JSON.stringify(statePatch));
          fs.writeFileSync('/tmp/matches.json', JSON.stringify(externalMatches));
          NODE

          patch_firebase() {
            local method="$1"
            local input_file="$2"
            local target_url="$3"
            local output_file="$4"

            local http_code
            http_code=$(curl --silent --show-error --retry 3 --retry-delay 2 \
              --request "$method" \
              --header "Content-Type: application/json" \
              --data-binary "@${input_file}" \
              --output "$output_file" \
              --write-out "%{http_code}" \
              "$target_url")

            if [ "$http_code" -lt 200 ] || [ "$http_code" -ge 300 ]; then
              echo "Firebase respondeu HTTP ${http_code}:"
              cat "$output_file"
              exit 1
            fi

            if grep -qi '"error"' "$output_file"; then
              echo "Firebase retornou erro:"
              cat "$output_file"
              exit 1
            fi
          }

          patch_firebase PATCH /tmp/state-patch.json \
            "${FIREBASE_DB_URL}/${BASE_PATH}/state.json?auth=${FIREBASE_SECRET}" \
            /tmp/state-response.json

          patch_firebase PUT /tmp/matches.json \
            "${FIREBASE_DB_URL}/${BASE_PATH}/matches.json?auth=${FIREBASE_SECRET}" \
            /tmp/matches-response.json

          echo "Sincronização concluída com sucesso."
